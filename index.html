<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Mercado Fácil Local</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <!-- Metade colorida ou com imagem -->
    <div class="left-side">
      <div class="content">
        <img src="imgs/logo.png" alt="Logo Mercado Fácil Local" class="logo">
        <h1>Mercado Fácil Local</h1>
        <p> Compre rápido, receba no conforto de casa.</p>
      </div>
    </div>

    <!-- Metade com formulário -->
    <div class="right-side">
      <div class="login-box">
        <h2>Login</h2>
        <form>
          <input type="email" placeholder="E-mail" required>
          <input type="password" placeholder="Senha" required>
          <button type="submit">Entrar</button>
        </form>
        <p class="links">
          <a href="#">Esqueceu a senha?</a><br>
          <a href="#">Criar conta</a>
        </p>
      </div>
    </div>

  </div>
</body>
</html>
